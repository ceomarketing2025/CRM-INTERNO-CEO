<style>
  .rem-shell{display:grid;gap:18px}

<style>

  .reminder-card.deadline-overdue{border-color:#fecaca}.reminder-card.deadline-today,.reminder-card.deadline-soon{border-color:#fed7aa}

  .project-legend{padding:15px 17px;display:grid;gap:10px}.project-legend-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.project-legend-head small{color:#64748b}
  .project-legend-items{display:flex;gap:8px 14px;flex-wrap:wrap}.project-legend-item{display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:#475569}
  .calendar-month-title{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;gap:12px}.calendar-month-title h3{margin:0}
  .calendar-item.project-event{--project-color:#64748b;position:relative;border-left:4px solid var(--project-color);background:color-mix(in srgb,var(--project-color) 10%,#fff);color:#0f172a;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:4px 5px}
