<form method="post" action="{% url 'operations:web_production_quick_toggle' project.pk %}" class="quick-status-form">{% csrf_token %}<input type="hidden" name="row_type" value="{{ row_type }}"><input type="hidden" name="row_id" value="{{ row.pk }}"><input type="hidden" name="field" value="{{ field }}"><select name="value" class="quick-status-select {% if field == 'state' %}{% if row.state == 'complete' %}yes{% else %}no{% endif %}{% else %}{% if row.review_status == 'complete' %}yes{% else %}no{% endif %}{% endif %}" onchange="this.form.submit()"><option value="incomplete" {% if field == 'state' %}{% if row.state != 'complete' %}selected{% endif %}{% else %}{% if row.review_status != 'complete' %}selected{% endif %}{% endif %}>No</option><option value="complete" {% if field == 'state' %}{% if row.state == 'complete' %}selected{% endif %}{% else %}{% if row.review_status == 'complete' %}selected{% endif %}{% endif %}>Sí</option></select></form>
