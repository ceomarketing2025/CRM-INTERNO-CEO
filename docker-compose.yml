services:
  backend:
    build: ./backend
    container_name: crm_ceo_v3_backend
    command: /app/docker-entrypoint.sh
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: ./backend
    container_name: crm_ceo_v3_celery
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    container_name: crm_ceo_v3_beat
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: crm_ceo_v3_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_ceo}
      POSTGRES_USER: ${POSTGRES_USER:-crm_ceo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_ceo_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_ceo} -d ${POSTGRES_DB:-crm_ceo}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: crm_ceo_v3_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  media_volume:
