<style id="marketing-custom-dropdown-styles">
  .mk-native-select {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  .mk-select {
    position: relative;
    width: 100%;
    min-width: 0;
  }

  .mk-select__button {
    width: 100%;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid #d7dfeb;
    border-radius: 15px;
    background: #ffffff;
    color: #13213a;
    font: inherit;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  .mk-select__button:hover {
    border-color: #9fb7ff;
    background: #fbfcff;
  }

  .mk-select__button:focus-visible {
    outline: none;
    border-color: #2f5ff2;
    box-shadow: 0 0 0 3px rgba(47, 95, 242, .13);
  }

  .mk-select.is-open .mk-select__button {
    border-color: #2f5ff2;
    box-shadow: 0 0 0 3px rgba(47, 95, 242, .10);
  }

  .mk-select.is-disabled .mk-select__button {
    cursor: not-allowed;
    opacity: .58;
    background: #f4f6f9;
  }

  .mk-select__value {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mk-select__value.is-placeholder {
    color: #7c8799;
    font-weight: 500;
  }

  .mk-select__chevron {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform .18s ease;
  }

  .mk-select__chevron::before {
    content: '';
    width: 7px;
    height: 7px;
    border-right: 2px solid #50627d;
    border-bottom: 2px solid #50627d;
    transform: rotate(45deg) translateY(-2px);
  }

  .mk-select.is-open .mk-select__chevron {
    transform: rotate(180deg);
  }

  .mk-select__menu {
    position: absolute;
    z-index: 1500;
    top: calc(100% + 7px);
    left: 0;
    right: 0;
    display: none;
    max-height: 260px;
    overflow-y: auto;
    padding: 7px;
    border: 1px solid #dce3ee;
    border-radius: 15px;
    background: #ffffff;
    box-shadow: 0 18px 45px rgba(20, 35, 65, .16);
  }

  .mk-select.is-open .mk-select__menu {
    display: block;
  }

  .mk-select__option {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 11px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: #24334c;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
  }

  .mk-select__option:hover,
  .mk-select__option:focus-visible {
    outline: none;
    background: #f1f5ff;
    color: #234ed7;
  }

  .mk-select__option.is-selected {
    background: #edf3ff;
    color: #214bd3;
  }

  .mk-select__option.is-selected::after {
    content: '✓';
    font-weight: 800;
  }

  .mk-select__option[disabled] {
    opacity: .45;
    cursor: not-allowed;
  }

  .field:has(.errorlist) .mk-select__button,
  .field:has(.field-error) .mk-select__button {
    border-color: #ef8f7e;
  }

  @media (max-width: 767px) {
    .mk-select__menu {
      max-height: 220px;
    }
  }
</style>
<script>
(function () {
  function closeAll(except) {
    document.querySelectorAll('.mk-select.is-open').forEach(function (root) {
      if (root !== except) {
        root.classList.remove('is-open');
        var button = root.querySelector('.mk-select__button');
        if (button) button.setAttribute('aria-expanded', 'false');
      }
    });
  }

  function enhanceSelect(select) {
    if (!select || select.multiple || select.dataset.mkEnhanced === '1') return;
    select.dataset.mkEnhanced = '1';
    select.classList.add('mk-native-select');

    var root = document.createElement('div');
    root.className = 'mk-select';

    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'mk-select__button';
    button.setAttribute('role', 'combobox');
    button.setAttribute('aria-haspopup', 'listbox');
    button.setAttribute('aria-expanded', 'false');
    if (select.id) button.setAttribute('aria-controls', select.id + '-mk-menu');

    var value = document.createElement('span');
    value.className = 'mk-select__value';
    var chevron = document.createElement('span');
    chevron.className = 'mk-select__chevron';
    chevron.setAttribute('aria-hidden', 'true');
    button.appendChild(value);
    button.appendChild(chevron);

    var menu = document.createElement('div');
    menu.className = 'mk-select__menu';
    menu.setAttribute('role', 'listbox');
    if (select.id) menu.id = select.id + '-mk-menu';

    root.appendChild(button);
    root.appendChild(menu);
    select.insertAdjacentElement('afterend', root);

    function optionLabel(option) {
      if (!option) return 'Seleccionar...';
      var text = (option.textContent || '').trim();
      if (!option.value && (!text || text === '---------' || /^-{3,}$/.test(text))) return 'Seleccionar...';
      return text || 'Seleccionar...';
    }

    function renderMenu() {
      menu.innerHTML = '';
      Array.prototype.forEach.call(select.options, function (option, index) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'mk-select__option';
        item.setAttribute('role', 'option');
        item.dataset.value = option.value;
        item.dataset.index = String(index);
        item.textContent = optionLabel(option);
        item.disabled = option.disabled;
        item.setAttribute('aria-selected', option.selected ? 'true' : 'false');
        if (option.selected) item.classList.add('is-selected');
        item.addEventListener('click', function () {
          if (item.disabled) return;
          select.value = option.value;
          select.dispatchEvent(new Event('input', { bubbles: true }));
          select.dispatchEvent(new Event('change', { bubbles: true }));
          sync();
          closeAll();
          button.focus();
        });
        menu.appendChild(item);
      });
    }

    function sync() {
      var selected = select.options[select.selectedIndex] || select.options[0];
      var text = optionLabel(selected);
      value.textContent = text;
      value.classList.toggle('is-placeholder', !selected || !selected.value);
      root.classList.toggle('is-disabled', !!select.disabled);
      button.disabled = !!select.disabled;
      button.setAttribute('aria-disabled', select.disabled ? 'true' : 'false');
      Array.prototype.forEach.call(menu.querySelectorAll('.mk-select__option'), function (item) {
        var active = item.dataset.value === select.value;
        item.classList.toggle('is-selected', active);
        item.setAttribute('aria-selected', active ? 'true' : 'false');
      });
    }

    button.addEventListener('click', function () {
      if (select.disabled) return;
      var opening = !root.classList.contains('is-open');
      closeAll(root);
      root.classList.toggle('is-open', opening);
      button.setAttribute('aria-expanded', opening ? 'true' : 'false');
      if (opening) {
        var selectedItem = menu.querySelector('.mk-select__option.is-selected:not([disabled])') || menu.querySelector('.mk-select__option:not([disabled])');
        if (selectedItem) window.setTimeout(function () { selectedItem.focus(); }, 0);
      }
    });

    button.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        if (!root.classList.contains('is-open')) button.click();
      }
      if (event.key === 'Escape') {
        closeAll();
        button.focus();
      }
    });

    menu.addEventListener('keydown', function (event) {
      var options = Array.prototype.slice.call(menu.querySelectorAll('.mk-select__option:not([disabled])'));
      var current = options.indexOf(document.activeElement);
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (options.length) options[(current + 1 + options.length) % options.length].focus();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (options.length) options[(current - 1 + options.length) % options.length].focus();
      } else if (event.key === 'Escape' || event.key === 'Tab') {
        closeAll();
        if (event.key === 'Escape') button.focus();
      }
    });

    select.addEventListener('change', sync);
    select.addEventListener('input', sync);

    var observer = new MutationObserver(function (mutations) {
      var rebuild = mutations.some(function (m) { return m.type === 'childList'; });
      if (rebuild) renderMenu();
      sync();
    });
    observer.observe(select, { attributes: true, childList: true, subtree: true });

    if (select.id) {
      var label = document.querySelector('label[for="' + CSS.escape(select.id) + '"]');
      if (label) {
        label.addEventListener('click', function (event) {
          event.preventDefault();
          button.focus();
          if (!select.disabled && !root.classList.contains('is-open')) button.click();
        });
      }
    }

    renderMenu();
    sync();
  }

  function initMarketingDropdowns() {
    document.querySelectorAll('form select:not([multiple])').forEach(enhanceSelect);
  }

  document.addEventListener('click', function (event) {
    if (!event.target.closest('.mk-select')) closeAll();
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') closeAll();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMarketingDropdowns);
  } else {
    initMarketingDropdowns();
  }
})();
</script>
